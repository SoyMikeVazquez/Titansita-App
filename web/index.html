<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plataforma premium de entrenamiento personal y nutrición. Registra tus comidas con Inteligencia Artificial, sigue tus rutinas y controla tu progreso físico.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Workout - Tu Coach de Fitness y Nutrición IA">
  <meta property="og:description" content="Plataforma premium de entrenamiento personal y nutrición. Registra tus comidas con Inteligencia Artificial, sigue tus rutinas y controla tu progreso físico.">
  <meta property="og:image" content="logo.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Workout - Tu Coach de Fitness y Nutrición IA">
  <meta name="twitter:description" content="Plataforma premium de entrenamiento personal y nutrición. Registra tus comidas con Inteligencia Artificial, sigue tus rutinas y controla tu progreso físico.">
  <meta name="twitter:image" content="logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Workout - Tu Coach de Fitness y Nutrición IA</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Premium Glassmorphism Loading Screen -->
  <div id="loading-indicator">
    <style>
      html, body {
        background-color: #0F0F0F;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        border-top: 3px solid #ffffff;
        width: 48px;
        height: 48px;
        animation: spin 1s linear infinite;
        margin-bottom: 24px;
      }
      .title {
        color: #ffffff;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.5px;
        margin: 0;
      }
      .subtitle {
        color: #A3A3A3;
        font-size: 13px;
        font-weight: 500;
        margin-top: 8px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <div class="loader-container">
      <div class="spinner"></div>
      <h1 class="title">Workout</h1>
    </div>
  </div>

  <script>
    // Fade out and remove loading indicator once Flutter starts rendering
    window.addEventListener('load', function(ev) {
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes) {
            for (var i = 0; i < mutation.addedNodes.length; i++) {
              var node = mutation.addedNodes[i];
              if (node.tagName === 'FLT-GLASS-PANE' || node.tagName === 'FLUTTER-VIEW') {
                var loader = document.getElementById('loading-indicator');
                if (loader) {
                  loader.style.transition = 'opacity 0.4s ease';
                  loader.style.opacity = '0';
                  setTimeout(function() {
                    loader.remove();
                  }, 400);
                }
                observer.disconnect();
                break;
              }
            }
          }
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
